name: Bug
description: Quelque chose qui marche aujourd'hui et ne devrait pas.
title: 'bug: '
body:
  - type: textarea
    id: resume
    attributes:
      label: Résumé
      description: Quoi est cassé, en une ou deux lignes.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Constaté
    validations:
      required: true
  - type: textarea
    id: hors
    attributes:
      label: Hors périmètre
