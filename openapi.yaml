openapi: 3.1.0
info:
  title: Hackathon App API
  version: 0.1.0
  license:
    name: UNLICENSED
  description: >
    Contrat HTTP de l'API du monolithe hackathon-app.
    Santé, ressource d'exemple « questions », proxy Data `/api/tendances`,
    et graine démo TrendRadar `/api/signaux` (profil, géo, confiance).
    Source de vérité, voir docs/adr/0006-contrat-api-openapi.md.
    Le service Data en amont a son propre contrat : docs/data/openapi.json.
    POST /api/tendances n'est que le proxy du monolithe.
security: []
servers:
  - url: http://localhost:3000
    description: Dev container, port 3000 relayé par VS Code
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Indique si l'API et la base répondent
      responses:
        '200':
          description: API et PostgreSQL joignables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                db: PostgreSQL 17.11
        '503':
          description: L'API tourne mais la base est injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/questions:
    get:
      operationId: listQuestions
      summary: Liste les questions les plus récentes
      parameters:
        - name: limit
          in: query
          required: false
          description: Nombre maximal de lignes (défaut 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Liste éventuellement vide
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
        '400':
          description: Paramètre limit invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createQuestion
      summary: Pose une question, enregistre la réponse de l'IA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewQuestion'
            example:
              question: Quelle est la capitale du Japon ?
      responses:
        '201':
          description: Question créée, avec la réponse de l'IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          description: Corps invalide (question manquante ou vide)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Question manquante
        '502':
          description: Le fournisseur d'IA n'a pas répondu correctement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/tendances:
    post:
      operationId: postTendances
      summary: Renvoie la tendance des ingrédients demandés
      description: >
        Proxy vers POST /tendances du service Data.
        Contrat amont : docs/data/openapi.json. Base : DATA_AI_URL dans api/.env.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TendancesRequest'
            example:
              termes: [Yuzu, Matcha, Vanilla]
      responses:
        '200':
          description: Une entrée par terme
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tendance'
        '400':
          description: termes absent ou vide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: termes manquants
        '502':
          description: L'API Data a répondu une erreur ou un corps inattendu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: DATA_AI_URL n'est pas configurée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: API Data non configurée (DATA_AI_URL)
  /api/signaux:
    get:
      operationId: listSignaux
      summary: Liste les signaux démo TrendRadar
      description: >
        Graine démo (45 signaux du mockup Globe). Les champs profil, geo et
        confiance viennent du seed, pas du contrat Data actuel.
        POST /api/tendances reste le proxy pour croissance/statut quand les
        termes matchent.
      parameters:
        - name: profil
          in: query
          required: false
          description: Filtre durable (T) ou buzz (B)
          schema:
            type: string
            enum: [durable, buzz]
        - name: min_confiance
          in: query
          required: false
          description: Confiance minimale incluse (défaut 50)
          schema:
            type: integer
            minimum: 50
            maximum: 100
            default: 50
        - name: q
          in: query
          required: false
          description: Recherche insensible à la casse sur le nom
          schema:
            type: string
        - name: fenetre
          in: query
          required: false
          description: >
            Ne garde que les signaux dont le mois de décollage (YYYYMM)
            tombe dans les N derniers jours
          schema:
            type: string
            enum: [7d, 30d, 90d]
      responses:
        '200':
          description: Liste éventuellement vide
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Signal'
              example:
                - id: 1
                  nom: Maritozzo
                  famille: Desserts
                  domaine: Goût
                  profil: durable
                  confiance_pct: 96
                  croissance_pct: null
                  statut_data: null
                  cc: IT
                  pays: Italie
                  lat: 41.91
                  lon: 12.51
                  ce_qui_plait: >
                    La brioche moelleuse fendue et débordante de crème
                    fouettée vanillée
                  veille_resume: La brioche romaine à la crème…
                  matieres:
                    [Farine de blé, Crème fraîche, Vanille, Zeste d'orange]
                  decollage: '202601'
                  predit_en: '202607'
                  verifiable_en: '202801'
                  created_at: '2026-11-12T12:00:00.000Z'
        '400':
          description: Paramètre de filtre invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/signaux/{id}:
    get:
      operationId: getSignal
      summary: Détail d'un signal avec sources dérivées
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Signal trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalDetail'
        '400':
          description: Identifiant invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Signal inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Signal introuvable
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        db:
          type: string
          description: Version renvoyée par PostgreSQL (`SELECT version()`)
    Question:
      type: object
      additionalProperties: false
      required: [id, question, answer, created_at]
      properties:
        id:
          type: integer
          minimum: 1
        question:
          type: string
        answer:
          type: string
        created_at:
          type: string
          format: date-time
    NewQuestion:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    TendancesRequest:
      type: object
      additionalProperties: false
      required: [termes]
      properties:
        termes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    Tendance:
      type: object
      additionalProperties: false
      required: [terme, croissance_pct, statut]
      properties:
        terme:
          type: string
        croissance_pct:
          type: number
        statut:
          type: string
          enum: ['émergent', stable, en baisse]
    Signal:
      type: object
      additionalProperties: false
      required:
        - id
        - nom
        - famille
        - domaine
        - profil
        - confiance_pct
        - cc
        - pays
        - lat
        - lon
        - ce_qui_plait
        - veille_resume
        - matieres
        - decollage
        - predit_en
        - verifiable_en
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        nom:
          type: string
        famille:
          type: string
        domaine:
          type: string
        profil:
          type: string
          enum: [durable, buzz]
        confiance_pct:
          type: integer
          minimum: 50
          maximum: 100
        croissance_pct:
          type: [number, 'null']
          description: Renseigné seulement si enrichi via l'API Data
        statut_data:
          type: [string, 'null']
          enum: ['émergent', stable, en baisse, null]
          description: Statut Data si disponible, sinon null
        cc:
          type: string
          description: Code pays ISO alpha-2
        pays:
          type: string
        lat:
          type: number
        lon:
          type: number
        ce_qui_plait:
          type: string
        veille_resume:
          type: string
        matieres:
          type: array
          items:
            type: string
        decollage:
          type: string
          description: Mois de décollage au format YYYYMM
          pattern: '^[0-9]{6}$'
        predit_en:
          type: string
          description: Mois prédit au format YYYYMM
          pattern: '^[0-9]{6}$'
        verifiable_en:
          type: string
          description: Mois vérifiable au format YYYYMM
          pattern: '^[0-9]{6}$'
        created_at:
          type: string
          format: date-time
    SignalSource:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
          format: uri
    SignalDetail:
      allOf:
        - $ref: '#/components/schemas/Signal'
        - type: object
          additionalProperties: false
          required: [sources]
          properties:
            sources:
              type: array
              items:
                $ref: '#/components/schemas/SignalSource'
